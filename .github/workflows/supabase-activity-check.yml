
name: Supabase Activity Check

on:
  schedule:
    - cron: "17 5,13,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query volleyball database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          curl --fail-with-body \
            --silent --show-error \
            --retry 2 \
            --max-time 30 \
            -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/public_open_gym_events" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

          echo "Supabase activity check completed."
