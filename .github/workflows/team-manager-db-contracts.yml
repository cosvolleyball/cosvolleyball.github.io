name: Teams Manager Database Contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - 'db/**'
      - '.github/workflows/team-manager-db-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: team_manager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d team_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only_password
      PGDATABASE: team_manager_test
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is present
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Build fake baseline schema (isolated container)
        run: psql -X -v ON_ERROR_STOP=1 -f db/tests/fixture.sql
      - name: Apply Teams Manager review draft to test database ONLY
        run: psql -X -v ON_ERROR_STOP=1 -1 -f db/drafts/event_day_manager_foundation.sql
      - name: Apply organizer draft and publication RPCs to test database ONLY
        run: psql -X -v ON_ERROR_STOP=1 -1 -f db/drafts/event_day_manager_rotations.sql
      - name: Verify permissions, roster import, privacy and existing event deletion
        run: psql -X -v ON_ERROR_STOP=1 -f db/tests/contracts.sql
      - name: Verify private drafts, explicit publication and early rotation ending
        run: psql -X -v ON_ERROR_STOP=1 -f db/tests/rotations.sql
