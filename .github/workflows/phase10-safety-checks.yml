name: Phase 10 Safety Checks

on:
  pull_request:
    paths:
      - "website/**"
      - "sql/phase10_*.sql"
      - "tests/phase10_*.sql"
      - ".github/workflows/phase10-safety-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify all website JavaScript parses
        run: node --check --input-type=module < website/app.js
      - name: Validate referenced Phase 10 form IDs
        run: |
          python3 - <<'PY'
          import pathlib, re
          js = pathlib.Path("website/app.js").read_text()
          html = pathlib.Path("website/index.html").read_text()
          ids = set(re.findall(r'id="([^"]+)"', html))
          referenced = set(re.findall(r'\$\("(phase10-[^"]+)"\)', js))
          missing = referenced - ids
          assert not missing, f"Missing HTML IDs referenced by JavaScript: {missing}"
          print(f"Validated {len(referenced)} Phase 10 DOM IDs.")
          PY
      - name: Validate SQL grammar
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pglast
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          for filename in sorted(Path("sql").glob("phase10_*.sql")):
              parse_sql(filename.read_text())
              print("Parsed:", filename)
          PY
      - name: Install isolated Postgres test client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Run isolated migration, behavior, security and rollback checks
        run: psql --no-psqlrc -v ON_ERROR_STOP=1 -f tests/phase10_integration.sql
